<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Labmate</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app" id="app">
    <nav class="sidebar">
      <button class="ghost icon-btn side-toggle" id="side-toggle" data-i18n-title="toggleSidebar"><span class="icon" data-icon="panel"></span></button>
      <ul class="nav" id="nav"></ul>
      <div class="nav-label" data-i18n="projects"></div>
      <ul class="nav" id="projects"></ul>
      <ul class="nav nav-bottom">
        <li data-view="settings" id="settings-btn"><span class="icon" data-icon="gear"></span><span class="label" data-i18n="settings"></span></li>
      </ul>
    </nav>

    <main class="main">
      <header class="head">
        <div class="head-top">
          <h1 id="title"></h1>
          <span class="head-date" id="subtitle"></span>
          <span class="swatches proj-colors" id="proj-colors" hidden></span>
          <button class="weather" id="weather" hidden></button>
          <button class="btn" id="papers-fetch" hidden data-i18n="papersFetch"></button>
        </div>
        <div class="weather-panel" id="weather-panel" hidden></div>
        <div class="stats" id="stats"></div>
      </header>
      <form class="quick-add qa-full" id="quick-add" autocomplete="off">
        <div class="qa-line">
          <span class="icon" data-icon="plus"></span>
          <input id="quick-input" data-i18n-aria="addTask">
        </div>
        <div class="qa-opts">
          <input type="date" class="qa-opt" id="qa-date" data-i18n-aria="dueDate">
          <input type="time" class="qa-opt" id="qa-time" data-i18n-aria="time">
          <select class="qa-opt" id="qa-recurrence" data-i18n-aria="repeat">
            <option value="" data-i18n="repeat"></option><option value="daily" data-i18n="daily"></option>
            <option value="weekly" data-i18n="weekly"></option><option value="monthly" data-i18n="monthly"></option>
          </select>
          <input class="qa-opt qa-project" id="qa-project" list="project-options" data-i18n-ph="project">
          <span class="qa-hint" data-i18n="qaHint"></span>
        </div>
      </form>
      <div class="list" id="list"></div>
      <div class="hint" id="hint"></div>

      <section class="settings" id="settings" hidden>
        <h2 data-i18n="general"></h2>
        <div class="setting">
          <div class="setting-label" data-i18n="theme"></div>
          <div class="segmented" id="set-theme">
            <button data-value="system" data-i18n="themeSystem"></button>
            <button data-value="light" data-i18n="themeLight"></button>
            <button data-value="dark" data-i18n="themeDark"></button>
          </div>
        </div>
        <div class="setting">
          <div class="setting-label" data-i18n="language"></div>
          <div class="segmented" id="set-lang">
            <button data-value="ko">한국어</button>
            <button data-value="en">English</button>
          </div>
        </div>
        <div class="setting">
          <div>
            <div class="setting-label" data-i18n="autostart"></div>
            <div class="setting-desc" id="autostart-desc"></div>
          </div>
          <div class="segmented" id="set-autostart">
            <button data-value="on" data-i18n="on"></button>
            <button data-value="off" data-i18n="off"></button>
          </div>
        </div>
        <div class="setting">
          <div class="setting-label" data-i18n="font"></div>
          <div class="setting-control">
            <select id="set-font"></select>
            <div class="font-preview" id="font-preview">오늘 할 일 · Today's tasks 0123</div>
          </div>
        </div>

        <h2 class="settings-group" data-i18n="notifications"></h2>
        <div class="setting">
          <div>
            <div class="setting-label" data-i18n="remind"></div>
            <div class="setting-desc" data-i18n="remindDesc"></div>
          </div>
          <div class="segmented" id="set-remind"></div>
        </div>
        <div class="setting">
          <div>
            <div class="setting-label" data-i18n="hotkey"></div>
            <div class="setting-desc" id="hotkey-desc"></div>
          </div>
          <kbd class="kbd" id="hotkey-key"></kbd>
        </div>

        <h2 class="settings-group" data-i18n="weather"></h2>
        <div class="setting">
          <div>
            <div class="setting-label" data-i18n="kmaKey"></div>
            <div class="setting-desc" data-i18n="kmaKeyDesc"></div>
          </div>
          <div class="setting-actions">
            <input class="text-input" id="set-kma-key" type="password" autocomplete="off">
            <button class="btn" id="kma-key-save" data-i18n="save"></button>
          </div>
        </div>
        <div class="setting">
          <div>
            <div class="setting-label" data-i18n="location"></div>
            <div class="setting-desc" id="weather-desc"></div>
          </div>
          <div class="place-search">
            <input class="text-input" id="place-input" data-i18n-ph="placeSearch" autocomplete="off">
            <div class="place-results" id="place-results" hidden></div>
          </div>
        </div>

        <h2 class="settings-group" data-i18n="papersGroup"></h2>
        <div class="setting">
          <div class="setting-label" data-i18n="papersEnabled"></div>
          <div class="segmented" id="set-papers-enabled">
            <button data-value="on" data-i18n="on"></button>
            <button data-value="off" data-i18n="off"></button>
          </div>
        </div>
        <div class="setting">
          <div>
            <div class="setting-label" data-i18n="papersPreprints"></div>
            <div class="setting-desc" data-i18n="papersPreprintsDesc"></div>
          </div>
          <div class="segmented" id="set-papers-preprints">
            <button data-value="on" data-i18n="include"></button>
            <button data-value="off" data-i18n="exclude"></button>
          </div>
        </div>
        <div class="setting">
          <div>
            <div class="setting-label" data-i18n="notifyText"></div>
            <div class="setting-desc" id="notify-text-desc"></div>
          </div>
          <div class="setting-actions">
            <input class="text-input" id="set-notify-text" maxlength="50">
            <button class="btn" id="notify-text-save" data-i18n="save"></button>
          </div>
        </div>
        <div class="setting column">
          <div class="setting-row">
            <div>
              <div class="setting-label" data-i18n="seeds"></div>
              <div class="setting-desc" data-i18n="seedsDesc"></div>
            </div>
            <div class="setting-actions">
              <input class="text-input" id="seed-input" data-i18n-ph="seedPh">
              <button class="btn" id="seed-add" data-i18n="add"></button>
            </div>
          </div>
          <div class="chips" id="seed-list"></div>
        </div>
        <div class="setting column">
          <div class="setting-row">
            <div>
              <div class="setting-label" data-i18n="keywords"></div>
              <div class="setting-desc" data-i18n="keywordsDesc"></div>
            </div>
            <div class="setting-actions">
              <input class="text-input" id="keyword-input" data-i18n-ph="keywordPh">
              <button class="btn" id="keyword-add" data-i18n="add"></button>
            </div>
          </div>
          <div class="chips" id="keyword-list"></div>
        </div>
        <div class="setting column">
          <div class="setting-row">
            <div>
              <div class="setting-label" data-i18n="journals"></div>
              <div class="setting-desc" data-i18n="journalsDesc"></div>
            </div>
            <div class="place-search">
              <input class="text-input" id="journal-input" data-i18n-ph="journalPh" autocomplete="off">
              <div class="place-results" id="journal-results" hidden></div>
            </div>
          </div>
          <div class="chips" id="journal-list"></div>
          <div class="setting-error" id="papers-settings-error" hidden></div>
        </div>

        <h2 class="settings-group" data-i18n="gcal"></h2>
        <div class="setting">
          <div>
            <div class="setting-label" data-i18n="gcalAccount"></div>
            <div class="setting-desc" id="gcal-desc"></div>
          </div>
          <div class="setting-actions" id="gcal-actions"></div>
        </div>
        <div class="setting column" id="gcal-colors-row" hidden>
          <div>
            <div class="setting-label" data-i18n="gcalColors"></div>
            <div class="setting-desc" data-i18n="gcalColorsDesc"></div>
          </div>
          <div id="gcal-colors"></div>
        </div>

        <h2 class="settings-group" data-i18n="updates"></h2>
        <div class="setting">
          <div>
            <div class="setting-label" data-i18n="updateVersion"></div>
            <div class="setting-desc" id="update-desc"></div>
          </div>
          <div class="setting-actions" id="update-actions"></div>
        </div>
        <div class="setting">
          <div>
            <div class="setting-label" data-i18n="updateAuto"></div>
            <div class="setting-desc" data-i18n="updateAutoDesc"></div>
          </div>
          <div class="segmented" id="set-update-auto">
            <button data-value="on" data-i18n="on"></button>
            <button data-value="off" data-i18n="off"></button>
          </div>
        </div>
      </section>
    </main>

    <aside class="detail" id="detail" hidden>
      <div class="detail-top">
        <button class="ghost icon-btn" id="detail-close" data-i18n-aria="close"><span class="icon" data-icon="x"></span></button>
      </div>
      <input class="detail-title" id="f-title" data-i18n-aria="title">
      <label class="field"><span data-i18n="bucket"></span>
        <select id="f-bucket">
          <option value="today" data-i18n="today"></option><option value="week" data-i18n="week"></option>
          <option value="later" data-i18n="later"></option><option value="someday" data-i18n="someday"></option>
        </select>
      </label>
      <label class="field"><span data-i18n="project"></span>
        <input id="f-project" list="project-options" data-i18n-ph="none">
        <datalist id="project-options"></datalist>
      </label>
      <div class="field"><span data-i18n="due"></span>
        <div class="row-2">
          <input type="date" id="f-date" data-i18n-aria="dueDate">
          <input type="time" id="f-time" data-i18n-aria="time">
        </div>
      </div>
      <label class="field"><span data-i18n="repeat"></span>
        <select id="f-recurrence">
          <option value="" data-i18n="none"></option><option value="daily" data-i18n="daily"></option>
          <option value="weekly" data-i18n="weekly"></option><option value="monthly" data-i18n="monthly"></option>
        </select>
      </label>
      <label class="field grow"><span data-i18n="notes"></span>
        <textarea id="f-notes" data-i18n-ph="notes"></textarea>
      </label>
      <button class="ghost danger" id="detail-delete"><span class="icon" data-icon="trash"></span><span data-i18n="moveToTrash"></span></button>
    </aside>
  </div>
  <div class="modal" id="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-text">
      <p class="modal-text" id="modal-text"></p>
      <div class="modal-actions">
        <button class="btn" id="modal-cancel" data-i18n="cancel"></button>
        <button class="btn primary" id="modal-ok"></button>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
